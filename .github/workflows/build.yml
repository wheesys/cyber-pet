name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cyber-pet-desktop/pnpm-lock.yaml
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator-dev
      - name: Install & build
        run: cd cyber-pet-desktop && pnpm install && pnpm build
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: cyber-pet-desktop
          args: --bundles deb,appimage
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'See CHANGELOG.md for details.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cyber-pet-desktop/pnpm-lock.yaml
      - name: Install & build
        run: cd cyber-pet-desktop && pnpm install && pnpm build
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: cyber-pet-desktop
          args: --bundles msi
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'See CHANGELOG.md for details.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cyber-pet-desktop/pnpm-lock.yaml
      - name: Install & build
        run: cd cyber-pet-desktop && pnpm install && pnpm build
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: cyber-pet-desktop
          args: --bundles dmg
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'See CHANGELOG.md for details.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
