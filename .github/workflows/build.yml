name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: cyber-pet-desktop/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator-dev
      - run: cd cyber-pet-desktop && pnpm install && pnpm build
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: cyber-pet-desktop
          args: --bundles deb,appimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: cyber-pet-desktop/pnpm-lock.yaml
      - run: cd cyber-pet-desktop && pnpm install && pnpm build
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: cyber-pet-desktop
          args: --bundles msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: cyber-pet-desktop/pnpm-lock.yaml
      - run: cd cyber-pet-desktop && pnpm install && pnpm build
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: cyber-pet-desktop
          args: --target ${{ matrix.target }}-apple-darwin --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
